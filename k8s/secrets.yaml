# Create this secret manually with:
# kubectl create secret generic postgres-secret \
#   --from-literal=password=YOUR_SECURE_PASSWORD \
#   --namespace=fourinrow

# Example template (DO NOT commit actual secrets to git):
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: fourinrow
type: Opaque
data:
  # Base64 encoded password
  # Example: echo -n "postgres" | base64
  password: cG9zdGdyZXM=  # REPLACE THIS WITH YOUR ACTUAL BASE64 ENCODED PASSWORD
